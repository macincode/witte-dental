name: witte_dental_pms
description: "Witte Dental PMS is a modern, responsive web application designed to streamline dental hospital operations. It provides comprehensive management tools for patient care, inventory, pharmacy, staff, and financial operations specifically tailored for dental hospitals and clinics."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.6.6
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Security
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  
  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+8
  firebase_messaging: ^15.1.3
  firebase_remote_config: ^5.1.3
  
  # Device Info & Permissions
  device_info_plus: ^10.1.2
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.2
  
  # UI
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.1
  
  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.4
  flutter_launcher_icons: ^0.14.1
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  fl_chart: ^1.1.1

  json_annotation: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"